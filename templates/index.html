{% load dict_extras %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Чеклист</title>
  <style>
    .container { display: flex; }
    .column { flex: 1; margin: 0 10px; border: 1px solid #ccc; padding: 10px; }
    .completed { text-decoration: line-through; color: gray; }
    .item { margin-bottom: 5px; }

    .item {
      display: flex;
      align-items: center;
      white-space: nowrap; /* Запрет переноса */
      gap: 8px; /* Расстояние между элементами */
      margin-bottom: 6px;
    }

    .item-index {
      color: #ccc; /* Серый цвет */
      user-select: none; /* Чтобы не выделялся */
      width: 20px;
      text-align: right;
      flex-shrink: 0; /* Индекс всегда занимает место */
    }

    .item-text.completed {
      text-decoration: line-through;
      color: gray;
    }

    .drop-target {
      background-color: #f0f8ff;
      border: 2px dashed #3399ff;
    }


  </style>
</head>
<body>

<div class="container" style="display: flex; gap: 20px;">
  {% load dict_extras %} <!-- загрузка фильтра get_item -->

  {% for priority in priorities %}
      <div class="column" data-priority-id="{{ priority.id }}" style="flex: 1; border: 1px solid #ccc; padding: 10px;">
        <h2>{{ priority.name }}</h2>
        <button class="add-btn">+</button>
        <div class="add-form" style="display:none; margin-top:10px;">
          <input type="text" placeholder="Текст" class="text-input"><br>
          <input type="date" class="date-input"><br>
          <button class="save-btn">Сохранить</button>
          <button class="cancel-btn">Отмена</button>
        </div>

        <div class="items" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)" style="min-height: 40px;">
          {% for item in items_by_priority|get_item:priority.id %}
            <div class="item" draggable="true" data-id="{{ item.id }}" style="display: flex; align-items: center; white-space: nowrap; gap: 8px; margin-bottom: 6px;">
              <span class="item-index" style="color: #ccc; user-select: none; width: 20px; text-align: right; flex-shrink: 0;">
                {{ forloop.counter }}.
              </span>
              <input type="checkbox" class="complete-checkbox" {% if item.completed %}checked{% endif %}>
              <span class="item-text{% if item.completed %} completed{% endif %}" style="{% if item.completed %}text-decoration: line-through; color: gray;{% endif %}">
                {{ item.text }} ({{ item.planned_date }})
              </span>
              <button class="remove-btn" style="flex-shrink: 0;">-</button>
            </div>
          {% empty %}
              <p class="empty-message" style="color: #888; font-style: italic; display: none;">(Пусто)</p>
          {% endfor %}
        </div>
      </div>

  {% endfor %}
</div>


<script>
    // Переменная для текущего перетаскиваемого элемента
    let draggedItem = null;

    function onDragOver(event) {
      event.preventDefault();
      const container = event.currentTarget;
      container.classList.add('drop-target');
    }

    function onDragLeave(event) {
      const container = event.currentTarget;
      container.classList.remove('drop-target');
    }

    function onDrop(event) {
      event.preventDefault();
      const container = event.currentTarget;
      container.classList.remove('drop-target');

      const draggedItemId = event.dataTransfer.getData('text/plain');
      const draggedItem = document.querySelector(`.item[data-id='${draggedItemId}']`);
      if(!draggedItem) return;

      // Вставляем элемент в эту пустую колонку
      container.appendChild(draggedItem);

      // Обновляем индексы в этой и других колонках
      updateIndices();

      // Обновляем отображение пустого сообщения
      updateEmptyMessage(container);

      // Отправляем запрос на сервер с новым приоритетом и позицией
      const newPriorityId = container.closest('.column').dataset.priorityId;
      const newOrder = Array.from(container.children).indexOf(draggedItem);

      fetch('/api/checklist/item/move', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({id: draggedItemId, priority: newPriorityId, order: newOrder})
      });
    }


    document.querySelectorAll('.item').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        draggedItem = item;
        item.classList.add('dragging');  // выделяем только этот элемент

        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', item.dataset.id);

        setTimeout(() => item.style.display = 'none', 0);
      });

      item.addEventListener('dragend', () => {
        if(draggedItem) {
          draggedItem.classList.remove('dragging');
          draggedItem.style.display = 'flex';
          draggedItem = null;
        }
      });
    });


    // Dragover/drop на контейнере с элементами
    document.querySelectorAll('.items').forEach(container => {
      container.addEventListener('dragover', (e) => {
        e.preventDefault();
        container.classList.add('drop-target');  // выделение контейнера для ясности
      });
      container.addEventListener('dragleave', () => {
        container.classList.remove('drop-target');
      });
      container.addEventListener('drop', (e) => {
        e.preventDefault();
        container.classList.remove('drop-target');

        const draggedId = e.dataTransfer.getData('text/plain');
        const draggedElem = document.querySelector(`.item[data-id='${draggedId}']`);
        if (!draggedElem) return;

        // Добавляем элемент в контейнер
        container.appendChild(draggedElem);

        updateIndices();
        updateEmptyMessage(container);

        // Отправляем update на сервер
        const newPriorityId = container.closest('.column').dataset.priorityId;
        const newOrder = Array.from(container.children).indexOf(draggedElem);

        fetch('/api/checklist/item/move', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
          },
          body: JSON.stringify({id: draggedId, priority: newPriorityId, order: newOrder})
        });
      });
    });

    // Обновление пустого сообщения
    function updateEmptyMessage(container) {
      if (!container) return; // защита от null
      const emptyMsg = container.querySelector('.empty-message');
      if (!emptyMsg) return; // если нет элемента с сообщением — выйти
      const itemsCount = container.querySelectorAll('.item').length;
      if (itemsCount === 0) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
      }
    }


    // Обновление нумерации
    function updateIndices() {
      document.querySelectorAll('.column').forEach(column => {
        const items = column.querySelectorAll('.item');
        items.forEach((item, i) => {
          const indexSpan = item.querySelector('.item-index');
          if (indexSpan) indexSpan.textContent = (i + 1) + '.';
        });
      });
    }
    // Вызовем при загрузке страницы и после любых манипуляций с элементами
    document.querySelectorAll('.items').forEach(updateEmptyMessage);
    updateIndices();


    window.addEventListener('load', () => {
      updateIndices();
    });
document.querySelectorAll('.add-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const col = btn.closest('.column');
    col.querySelector('.add-btn').style.display = 'none';
    col.querySelector('.add-form').style.display = 'block';
  });
});

document.querySelectorAll('.cancel-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const col = btn.closest('.column');
    col.querySelector('.add-form').style.display = 'none';
    col.querySelector('.add-btn').style.display = 'inline-block';
  });
});

document.querySelectorAll('.save-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const col = btn.closest('.column');
    const priorityId = col.dataset.priorityId;
    console.log("ПРИОРИРЕТ", priorityId)
    const textInput = col.querySelector('.text-input');
    const dateInput = col.querySelector('.date-input');
    const text = textInput.value.trim();
    const planned_date = dateInput.value;

    if (!text || !planned_date) {
      alert('Заполните все поля');
      return;
    }

    fetch('{% url "checklist-item-create" %}', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
      body: JSON.stringify({text, planned_date, priority: priorityId})
    })
    .then(response => response.json())
    .then(data => {
      if (data.error) {
        alert(data.error);
        return;
      }
      addItemToColumn(col, data);
      textInput.value = '';
      dateInput.value = '';
      col.querySelector('.add-form').style.display = 'none';
      col.querySelector('.add-btn').style.display = 'inline-block';
        updateIndices();
    });
  });
});

function addItemToColumn(column, item) {
  const itemsDiv = column.querySelector('.items');
  const div = document.createElement('div');
  div.className = 'item';
  div.dataset.id = item.id;
  div.innerHTML = `
    <span class="item-index" style="color: #ccc; user-select: none; width: 20px; text-align: right; flex-shrink: 0;">
    </span>
    <input type="checkbox" class="complete-checkbox">
    <span>${item.text} (${item.planned_date})</span>
    <button class="remove-btn">-</button>
  `;
  itemsDiv.prepend(div);
  attachItemEventListeners(div);
}

function attachItemEventListeners(itemDiv) {
  const checkbox = itemDiv.querySelector('.complete-checkbox');
  checkbox.addEventListener('change', () => {
    const id = itemDiv.dataset.id;
    fetch(`/api/checklist/item/${id}/toggle_completed`, {
      method: 'POST',
      headers: {'X-CSRFToken': getCookie('csrftoken')}
    })
    .then(response => response.json())
    .then(data => {
      if (data.completed) {
        itemDiv.classList.add('completed');
      } else {
        itemDiv.classList.remove('completed');
      }
      moveItemWithinColumn(itemDiv);
        updateIndices();
    });
  });

  const removeBtn = itemDiv.querySelector('.remove-btn');
  removeBtn.addEventListener('click', () => {
    if (!confirm('Вы уверены, что хотите удалить элемент?')) return;
    const id = itemDiv.dataset.id;
    fetch(`/api/checklist/item/${id}/archive`, {
      method: 'POST',
      headers: {'X-CSRFToken': getCookie('csrftoken')}
    }).then(response => response.json())
      .then(data => {
        if (data.archived) {
          itemDiv.remove();
            updateIndices();
        }
      });
  });
}

function moveItemWithinColumn(itemDiv) {
  const column = itemDiv.closest('.column');
  const itemsDiv = column.querySelector('.items');
  itemDiv.remove();
  if (itemDiv.classList.contains('completed')) {
    itemsDiv.appendChild(itemDiv);
  } else {
    itemsDiv.prepend(itemDiv);
  }
}

document.querySelectorAll('.item').forEach(attachItemEventListeners);

// Получить CSRF токен
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (const cookie of cookies) {
      const trimmed = cookie.trim();
      if (trimmed.startsWith(name + '=')) {
        cookieValue = decodeURIComponent(trimmed.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>

</body>
</html>
